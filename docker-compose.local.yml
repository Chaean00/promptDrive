services:
  mysql:
    image: mysql:8.4
    container_name: promptdrive-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-promptdrive}
      MYSQL_USER: ${MYSQL_USER:-promptdrive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-5678}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - promptdrive-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
volumes:
  promptdrive-mysql-data:
