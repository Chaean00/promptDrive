services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - promptdrive
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  promptdrive-backend:
    image: docker.io/${DOCKERHUB_USERNAME}/promptdrive-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      DATABASE_USERNAME: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      FRONTEND_ORIGIN: https://promptdrive.co.kr
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - promptdrive

networks:
  promptdrive:
    external: true
    name: promptdrive

volumes:
  mysql_data:
