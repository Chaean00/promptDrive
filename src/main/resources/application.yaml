spring:
  application:
    name: promptDrive
  config:
    import: optional:file:./.env[.properties]
  profiles:
    default: local

member:
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
    kakao:
      client-id: ${KAKAO_OAUTH_CLIENT_ID:}
      client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI:}
    state-encryption-key: ${OAUTH_STATE_ENCRYPTION_KEY:}
    allowed-return-paths: ${OAUTH_ALLOWED_RETURN_PATHS:/}
    allowed-origins: ${OAUTH_ALLOWED_ORIGINS:${FRONTEND_ORIGIN:http://localhost:3000}}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

security:
  jwt:
    signing-key: ${JWT_SIGNING_KEY:}
    issuer: ${JWT_ISSUER:promptdrive}
    audience: ${JWT_AUDIENCE:promptdrive-api}

seo:
  site-url: ${FRONTEND_ORIGIN:http://localhost:3000}

logging:
  pattern:
    level: "[traceId=%X{traceId:-}] %5p"
